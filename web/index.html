<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fusion</title>
<link rel="stylesheet" href="/vendor/github.min.css" media="(prefers-color-scheme: light)" />
<link rel="stylesheet" href="/vendor/github-dark.min.css" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="/vendor/katex.min.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form">
    <h1>Fusion</h1>
    <input type="text" name="username" autocomplete="username" value="fusion" hidden />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus />
    <button type="submit">Sign in</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-head">
      <button id="new-conv" class="primary">+ New conversation</button>
      <button id="toggle-sidebar" class="icon" title="Hide sidebar">◀</button>
    </div>
    <ul id="conv-list" class="conv-list"></ul>
    <div class="sidebar-foot">
      <button id="logout" class="link">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="show-sidebar" class="icon hidden" title="Show sidebar">▶</button>
      <span id="conv-title" class="conv-title">Fusion</span>
    </header>
    <section id="turns" class="turns"></section>
    <footer class="composer">
      <div id="provider-picks" class="picks"></div>
      <p class="hint">All models answer offline — no web search or browsing — so nothing from the live web is mixed into the answers. Each one knows the world only up to its training cutoff: <span id="cutoffs"></span></p>
      <div class="composer-row">
        <textarea id="question" rows="3" placeholder="Ask anything… (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send" class="primary">Ask</button>
        <button id="stop" class="danger hidden" title="Stop the running turn">Stop</button>
      </div>
      <div id="composer-note" class="note"></div>
    </footer>
  </main>
</div>

<template id="turn-tpl">
  <article class="turn">
    <div class="q"></div>
    <div class="fused">
      <div class="fused-head">
        <span class="badge synth-badge">Fusing…</span>
        <span class="meta synth-meta"></span>
        <button type="button" class="copy-md hidden" title="Copy the answer as Markdown">Copy</button>
      </div>
      <div class="md answer"></div>
    </div>
    <details class="analysis hidden">
      <summary>Where the models disagree</summary>
      <div class="analysis-body"></div>
    </details>
    <div class="lanes"></div>
  </article>
</template>

<template id="lane-tpl">
  <details class="lane">
    <summary>
      <span class="lane-name"></span>
      <span class="badge lane-status">queued</span>
      <span class="meta lane-meta"></span>
      <button type="button" class="copy-md hidden" title="Copy this answer as Markdown">Copy</button>
    </summary>
    <div class="md lane-body"></div>
  </details>
</template>

<script type="module" src="/app.js"></script>
</body>
</html>
